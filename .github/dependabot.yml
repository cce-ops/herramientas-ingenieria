version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
    groups:
      data-science:
        patterns:
          - "pandas"
          - "numpy*"
          - "scipy"
          - "matplotlib"
          - "plotly"
          - "networkx"
        update-types:
          - "minor"
          - "patch"
      web-framework:
        patterns:
          - "streamlit*"
        update-types:
          - "minor"
          - "patch"
      ai-providers:
        patterns:
          - "google-genai"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"