name: Security Audit

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  secrets:
    name: Secret Detection (TruffleHog)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin
      - name: Run TruffleHog
        run: trufflehog filesystem --json --fail ./ || true

  sast:
    name: Static Analysis (Semgrep)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto
          args: --error --json=semgrep-results.json
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.json
          category: semgrep

  deps:
    name: Dependency Audit (npm)
    runs-on: ubuntu-latest
    continue-on-error: true
    if: hashFiles('package.json') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm audit --audit-level=high --json > npm-audit.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: npm-audit-report, path: npm-audit.json, retention-days: 30 }
      - name: Fail on high/critical
        run: |
          HIGH=$(jq '[.vulnerabilities[] | select(.severity=="high" or .severity=="critical")] | length' npm-audit.json)
          if [ "$HIGH" -gt 0 ]; then echo "::error::Found $HIGH high/critical"; exit 1; fi

  deps-python:
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    continue-on-error: true
    if: hashFiles('requirements.txt') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - run: pip-audit -r requirements.txt --format=json --output=pip-audit.json --desc on || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: pip-audit-report, path: pip-audit.json, retention-days: 30 }

  sri-check:
    name: Subresource Integrity Check
    runs-on: ubuntu-latest
    continue-on-error: true
    if: hashFiles('*.html') != ''
    steps:
      - uses: actions/checkout@v4
      - run: |
          MISSING=$(grep -r 'src="https://' --include="*.html" | grep -v 'integrity=' || true)
          if [ -n "$MISSING" ]; then echo "::warning::$MISSING"; else echo "✅ All scripts have integrity"; fi
